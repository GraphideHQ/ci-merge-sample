name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit under test
        run: git log -1 --format='commit %H tree %T parents %P'
      - name: Check the tree
        run: sh check.sh
