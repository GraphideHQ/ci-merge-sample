name: browser
# graphide-ci's derived layers from pull request runs (zero-touch plan Z7): a workflow that runs
# only on pull requests, whose setup installs Playwright's browsers with their system
# dependencies. A layer for it can only be derived from its pull request runs.
on:
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ${{ vars.GRAPHIDE_CI_RUNNER == 'off' && 'ubuntu-latest' || 'graphide-linux-x64-4' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
